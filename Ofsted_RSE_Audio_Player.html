<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofsted RSE Questions & Answers – Marshfield Primary School</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    min-height: 100vh;
    padding: 1rem;
  }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding-bottom: 3rem;
  }

  header {
    background: #1e3a5f;
    border-radius: 16px;
    padding: 1.5rem 1.5rem 1.25rem;
    margin-bottom: 1.25rem;
    color: white;
  }

  .school-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #90b8e0;
    margin-bottom: 4px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 1rem;
  }

  .player-controls {
    background: #162d4a;
    border-radius: 12px;
    padding: 1rem;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #90b8e0;
    margin-bottom: 6px;
  }

  .progress-track {
    height: 4px;
    background: #0f1e30;
    border-radius: 2px;
    margin-bottom: 1rem;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #4a9eff;
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    padding: 8px 14px;
    transition: background 0.15s, transform 0.1s;
  }

  button:active { transform: scale(0.97); }

  #playBtn {
    background: #4a9eff;
    color: white;
    padding: 9px 18px;
    font-size: 15px;
  }

  #playBtn:hover { background: #3a8eef; }

  .btn-sec {
    background: #243d55;
    color: #c8ddf0;
  }

  .btn-sec:hover { background: #2e4e6b; }

  .speed-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #90b8e0;
  }

  select {
    background: #243d55;
    color: #c8ddf0;
    border: 1px solid #2e4e6b;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
    cursor: pointer;
  }

  .speaking-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #4a9eff;
    margin-left: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .speaking-indicator.visible { opacity: 1; }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4a9eff;
    animation: pulse 1s infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

  .qa-list { display: flex; flex-direction: column; gap: 10px; }

  .qa-card {
    background: white;
    border-radius: 14px;
    padding: 1.1rem 1.25rem;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .qa-card:hover { border-color: #bee3f8; }

  .qa-card.active {
    border-color: #4a9eff;
    box-shadow: 0 0 0 3px rgba(74,158,255,0.12);
  }

  .q-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #4a9eff;
    margin-bottom: 4px;
  }

  .q-text {
    font-size: 15px;
    font-weight: 600;
    color: #1a202c;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .a-text {
    font-size: 14px;
    color: #4a5568;
    line-height: 1.65;
  }

  .tap-hint {
    font-size: 12px;
    color: #718096;
    text-align: center;
    margin: 0.5rem 0 1rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .progress-fill, .qa-card { transition: none; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <p class="school-name">Marshfield Primary School</p>
    <h1>Ofsted RSE Questions &amp; Answers</h1>
    <div class="player-controls">
      <div class="progress-info">
        <span id="progLabel">Question 1 of 14</span>
        <span id="progPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progFill" style="width:0%"></div>
      </div>
      <div class="btn-row">
        <button id="playBtn" onclick="togglePlay()">▶ Play all</button>
        <button class="btn-sec" onclick="stopAll()">■ Stop</button>
        <button class="btn-sec" onclick="prevQ()">← Prev</button>
        <button class="btn-sec" onclick="nextQ()">Next →</button>
        <div class="speed-wrap">
          Speed:
          <select id="speedSel" onchange="changeSpeed()">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
          </select>
        </div>
      </div>
      <div class="speaking-indicator" id="speakingInd">
        <span class="dot"></span> Playing…
      </div>
    </div>
  </header>

  <p class="tap-hint">Tap any question to jump to it</p>

  <div class="qa-list" id="qalist"></div>

</div>

<script>
const qas = [
  {q:"How do you ensure your RSE curriculum meets statutory requirements?",a:"At Marshfield, we see RSE as far more than a statutory requirement. It is a fundamental safeguarding tool and a key part of our vision of Excellence for All. Following the publication of the updated DfE guidance, we undertook a comprehensive review of our existing provision and identified several areas where we wanted to strengthen coverage, including consent education, misogyny and gender-based harm, online influences and artificial intelligence. As a result, we adopted the Kapow RSE curriculum as our core programme. Leaders have mapped the curriculum from EYFS to Year 6 to ensure full statutory coverage, clear progression and age-appropriate sequencing. We review the curriculum regularly to ensure it remains relevant to the changing world our children are growing up in."},
  {q:"How do you ensure pupils are prepared for modern life?",a:"Our aim is not simply compliance; it is preparation. We want pupils to leave Marshfield with the knowledge, confidence and critical thinking skills needed to navigate relationships, technology and the wider world safely. Through our curriculum, pupils learn about healthy relationships, consent, personal boundaries, online safety, equality, diversity, respect and emotional wellbeing. We also teach children how to identify misinformation, challenge stereotypes and seek help when needed. Ultimately, we want every child to leave Marshfield academically successful, emotionally literate, resilient and ready to thrive in modern Britain."},
  {q:"How do you teach pupils about protected characteristics?",a:"We explicitly teach pupils about the protected characteristics outlined in the Equality Act 2010. Through our RSE curriculum, assemblies, literature, curriculum experiences and wider school culture, children learn to celebrate diversity and understand that everyone deserves to be treated with dignity, respect and kindness. In a community where over 76% of pupils speak English as an Additional Language and more than 20 home languages are represented, promoting understanding, inclusion and belonging is particularly important. Our pupils learn to value differences and challenge prejudice in all its forms."},
  {q:"How do you adapt the curriculum to meet local needs and safeguarding risks?",a:"Whilst Kapow provides our core curriculum entitlement, we recognise that a one-size-fits-all approach is not sufficient. Leaders regularly analyse safeguarding records, attendance data, behaviour patterns, pupil voice, community intelligence and local authority updates to identify emerging risks. This intelligence informs our personalised safeguarding curriculum delivered through Pol-Ed. This enables us to address local and emerging issues that are particularly relevant to our pupils, ensuring learning remains responsive, meaningful and rooted in real-life experiences."},
  {q:"How do you teach consent in primary school?",a:"Consent is taught in an age-appropriate way throughout the school. In EYFS and Key Stage 1, this focuses on personal space, body autonomy, asking permission and respecting the wishes of others. As pupils move through Key Stage 2, learning develops into understanding boundaries, peer pressure, mutual respect and recognising when something does not feel right. The emphasis is always on helping children understand that they have control over their own bodies and that everyone's boundaries deserve respect."},
  {q:"How do you address misogyny and gender-based harm?",a:"We believe prevention begins in primary school. Through our curriculum and wider school culture, we actively challenge stereotypes and promote equality, respect and positive relationships. Pupils learn that all people deserve respect regardless of gender and are encouraged to challenge discriminatory language and behaviour. This work is reinforced through assemblies, literature, curriculum content and positive role models throughout the school."},
  {q:"How do you teach online safety and AI?",a:"Online safety is embedded throughout our curriculum rather than being taught as a standalone topic. Pupils learn how to stay safe online, critically evaluate information, identify misinformation and understand the influence of digital content. As technology continues to evolve, we have introduced age-appropriate discussions around artificial intelligence and online influences, helping children understand that not everything they see online is accurate or trustworthy. Our aim is to develop informed, critical and responsible digital citizens."},
  {q:"How do you support pupils' wellbeing?",a:"Pupil wellbeing is central to everything we do. Alongside our RSE curriculum, we use the My Happy Mind programme to develop children's understanding of mental health, resilience and emotional regulation. We have also established Connect Advisors, a team of trained pupil leaders who act as positive role models and help signpost younger children to trusted adults when support is needed. This helps create a culture where seeking help is normalised and every child feels connected, valued and supported."},
  {q:"How do pupils contribute to personal development and wellbeing in school?",a:"We believe personal development is most powerful when pupils take ownership. Our Connect Advisors are trained through the My Happy Mind programme and play an active role in promoting wellbeing across the school. They support their peers, encourage positive relationships and help children access support when needed. This develops leadership, empathy, responsibility and confidence, whilst strengthening our culture of care and belonging."},
  {q:"How do you enrich RSE and personal development beyond the classroom?",a:"Our Carlton Edge Offer plays a significant role in bringing learning to life. We believe children learn best when learning is memorable, meaningful and connected to the world around them. Through carefully planned visits, visitors and experiences, pupils are able to contextualise their learning and apply it to real-life situations. As part of the Carlton Edge Offer, pupils participate in a range of workshops and experiences including fire safety, anti-vaping education, drug awareness, road safety, water safety, online safety and other safeguarding initiatives. These experiences equip children with the knowledge, confidence and practical skills needed to keep themselves safe."},
  {q:"How do you ensure the curriculum is inclusive for pupils with SEND?",a:"Inclusion is at the heart of our approach. We recognise that some pupils may require additional support to access and understand concepts taught within RSE. Teachers use visual supports, adapted resources, pre-teaching and additional discussion opportunities to ensure all pupils can access learning successfully. We work closely with families and external professionals where appropriate to ensure learning is meaningful, accessible and relevant for every child."},
  {q:"How do you engage parents with RSE?",a:"We view parents as partners in their children's education. Curriculum information is shared openly and transparently, and parents are given opportunities to view resources and ask questions. We recognise that families may hold a range of views and experiences, particularly within our diverse community. Our approach is always respectful whilst ensuring we fulfil our statutory responsibility to prepare children for life in modern Britain."},
  {q:"How do you know the curriculum is effective?",a:"We evaluate impact through pupil voice, lesson visits, curriculum reviews, safeguarding information, discussions with staff and parental feedback. Pupils are able to articulate what healthy relationships look like, how to keep themselves safe, who they can talk to if they are worried and why respect is important. Pupil voice consistently demonstrates that children feel safe, valued and supported. They know where to seek help and can confidently discuss key concepts such as respect, consent, online safety and wellbeing."},
  {q:"What is the overall impact of your RSE curriculum?",a:"The impact is that pupils feel safe, respected and included. They understand how to build healthy relationships, recognise risk, seek help and make informed choices. They know that differences should be celebrated and that everyone deserves respect. Through a combination of the Kapow curriculum, Pol-Ed safeguarding programme, My Happy Mind, Connect Advisors and our Carlton Edge Offer, pupils develop the knowledge, skills and character needed to flourish both in school and beyond. Ultimately, our aim is that every child leaves Marshfield not only academically successful, but also emotionally literate, resilient, responsible and ready to thrive in modern Britain."}
];

let currentIdx = 0;
let isPlaying = false;
let playAll = false;

function render() {
  const list = document.getElementById('qalist');
  list.innerHTML = '';
  qas.forEach((qa, i) => {
    const div = document.createElement('div');
    div.className = 'qa-card' + (i === currentIdx ? ' active' : '');
    div.id = 'qa-' + i;
    div.innerHTML =
      '<div class="q-num">Q' + (i+1) + '</div>' +
      '<div class="q-text">' + qa.q + '</div>' +
      '<div class="a-text">' + qa.a + '</div>';
    div.onclick = function() { stopAll(); currentIdx = i; playAll = false; render(); speak(i); };
    list.appendChild(div);
  });
  updateUI();
}

function updateUI() {
  const pct = Math.round((currentIdx / qas.length) * 100);
  document.getElementById('progLabel').textContent = 'Question ' + (currentIdx+1) + ' of ' + qas.length;
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('playBtn').textContent = isPlaying ? '⏸ Pause' : (currentIdx === 0 && !isPlaying ? '▶ Play all' : '▶ Resume');
  document.getElementById('speakingInd').className = 'speaking-indicator' + (isPlaying ? ' visible' : '');
  const active = document.getElementById('qa-' + currentIdx);
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function speak(idx) {
  if (!('speechSynthesis' in window)) {
    alert('Your browser does not support text-to-speech. Try Chrome or Safari.');
    return;
  }
  window.speechSynthesis.cancel();
  const qa = qas[idx];
  const rate = parseFloat(document.getElementById('speedSel').value);
  const utt = new SpeechSynthesisUtterance(
    'Question ' + (idx+1) + '. ' + qa.q + '. Answer. ' + qa.a
  );
  utt.rate = rate;
  utt.lang = 'en-GB';
  utt.onstart = function() { isPlaying = true; updateUI(); };
  utt.onend = function() {
    isPlaying = false;
    if (playAll && currentIdx < qas.length - 1) {
      currentIdx++;
      render();
      speak(currentIdx);
    } else {
      updateUI();
    }
  };
  utt.onerror = function() { isPlaying = false; updateUI(); };
  window.speechSynthesis.speak(utt);
}

function togglePlay() {
  if (isPlaying) {
    window.speechSynthesis.pause();
    isPlaying = false;
    updateUI();
  } else if (window.speechSynthesis.paused) {
    window.speechSynthesis.resume();
    isPlaying = true;
    updateUI();
  } else {
    playAll = true;
    render();
    speak(currentIdx);
  }
}

function stopAll() {
  playAll = false;
  isPlaying = false;
  window.speechSynthesis.cancel();
  updateUI();
}

function nextQ() {
  stopAll();
  if (currentIdx < qas.length - 1) { currentIdx++; render(); }
}

function prevQ() {
  stopAll();
  if (currentIdx > 0) { currentIdx--; render(); }
}

function changeSpeed() {
  if (isPlaying) { stopAll(); speak(currentIdx); }
}

render();
</script>
</body>
</html>
